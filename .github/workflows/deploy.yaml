name: CI/CD Pipeline with CodeDeploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Build application
        run: echo "Building application"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::249415164040:role/github-pipeline
          aws-region: us-east-1

      - name: Create deployment package
        run: zip -r deployment.zip . -x "*.git*" "node_modules/*"

      - name: Upload to S3
        run: aws s3 cp deployment.zip s3://johanna1983/deployment.zip

      - name: Trigger CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name deployment \
            --deployment-group-name deployment-group \
            --s3-location bucket=johanna1983,key=deployment.zip,bundleType=zip
